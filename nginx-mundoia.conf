# Configuración de nginx para MundoIA
# /etc/nginx/sites-available/mundoia

server {
    listen 80;
    server_name mundoia.cuerpolibre.cl;

    # Redirigir HTTP a HTTPS (si tienes SSL)
    # return 301 https://$server_name$request_uri;
    
    # Si no tienes SSL, sirve directamente en HTTP
    location / {
        # Servir frontend Next.js (en desarrollo o build estático)
        # Ajusta la ruta según corresponda:
        # - Para desarrollo con next dev: proxy a localhost:3000
        # - Para producción con build estático: root /var/www/mundoia
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para la API REST
    location /games/ {
        proxy_pass http://localhost:8005/games/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /game/ {
        proxy_pass http://localhost:8005/game/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para WebSocket
    location /ws/ {
        proxy_pass http://localhost:8005/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional: servir archivos estáticos directamente (si haces build)
    # location /_next/ {
    #     alias /home/gato/Proyectos/MundoIA/web/frontend/out/_next/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}

# Si usas HTTPS, añade otro server block con listen 443 ssl
