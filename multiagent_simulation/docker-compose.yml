services:
  mundoia-db:
    image: postgres:16
    container_name: mundoia-db
    environment:
      POSTGRES_DB: mundoia
      POSTGRES_USER: architect
      POSTGRES_PASSWORD: mundoia_secret_2026
    ports:
      - "5434:5432"
    volumes:
      - mundoia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d mundoia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mundoia_data:
