[supervisord]
nodaemon=true

[program:uvicorn]
command=uvicorn api:app --host 0.0.0.0 --port 8000 --reload
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/uvicorn.err.log
stdout_logfile=/var/log/uvicorn.out.log

[program:watchmedo]
command=watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- uvicorn api:app --host 0.0.0.0 --port 8000 --reload
autostart=true
autorestart=true
stderr_logfile=/var/log/watchmedo.err.log
stdout_logfile=/var/log/watchmedo.out.log